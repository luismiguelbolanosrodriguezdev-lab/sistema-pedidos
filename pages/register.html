<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
  </head>
  <body>
    <form id="formRegister">
  <label for="businessName">Nombre del negocio</label>
  <input type="text" id="businessName" maxlength="100" required />

  <label for="ownerName">Tu nombre</label>
  <input type="text" id="ownerName" maxlength="100" autocomplete="name" required />

  <label for="email">Correo</label>
  <input type="email" id="email" maxlength="254" autocomplete="email" required />

  <label for="password">Contraseña (mínimo 8 caracteres)</label>
  <input type="password" id="password" minlength="8" maxlength="72" autocomplete="new-password" required />

  <label for="confirmPassword">Repite la contraseña</label>
  <input type="password" id="confirmPassword" autocomplete="new-password" required />

  <input type="submit" value="Crear cuenta" id="registerButton" />
  <p id="registerMessage" role="alert"></p>
</form>

<p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>

  <script src="../js/registroFrontend.js"></script>
  </body>
</html>
