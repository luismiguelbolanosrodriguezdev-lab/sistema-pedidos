<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesion</title>
</head>
<body>
    <form id="formLogin">
  <label for="email">Correo</label>
  <input type="email" id="email" maxlength="254" autocomplete="email" required />

  <label for="password">Contraseña</label>
  <input type="password" id="password" minlength="8" maxlength="72" autocomplete="new-password" required />

  <input type="submit" value="Ingresar" id="loginButton" />
  <p id="loginMessage" role="alert"></p>
</form>

<p>¿No estas registrado? <a href="register.html">Registrate</a></p>

<script src="../js/api.js" ></script>
<script src="../js/loginFrontend.js" ></script>
</body>
</html>
