<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
  </head>
  <body>
    <form id="formRegister">
      <input type="text" id="businessName" placeholder="Nombre del Negocio" />
      <br />
      <input type="text" id="ownerName" placeholder="Nombre del dueño" />
      <br />
      <input type="text" id="password" placeholder="Contraseña" />
      <br />
      <input type="email" id="email" placeholder="Contraseña" />
      <br />
      <input type="submit" value="Registrarse" id="buttonRegister" />
      <br />
      <input type="button" id="cancelEdit" value="Cancelar" hidden />
    </form>

    <div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>

    <script src="/backend/routes/auth.js"></script>
  </body>
</html>
