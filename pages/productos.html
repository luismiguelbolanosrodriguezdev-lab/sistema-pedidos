<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos</title>
  </head>
  <body>
    <form id="formProduct">
      <input type="text" id="nameProduct" placeholder="Nombre Producto" />
      <br />
      <input type="number" id="priceProduct" placeholder="Precio Producto" />
      <br />
      <input type="submit" value="Agregar Producto" id="buttonCreateProduct" />
      <br />
      <input type="button" id="cancelEdit" value="Cancelar" hidden />
    </form>

    <div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Acciones</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>

    <script src="/js/productos.js"></script>
  </body>
</html>
